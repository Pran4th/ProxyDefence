networks:
  proxy_net:
    driver: bridge

services:
  # --- Infrastructure Services ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    networks:
      - proxy_net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    networks:
      - proxy_net
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - proxy_net
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d defenseintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application Microservices ---
  ingest-service:
    build:
      context: .
      dockerfile: services/ingest-service/Dockerfile
    container_name: ingest-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NEWS_API_KEY: ${NEWS_API_KEY}
    ports:
      - "8001:8000"
    networks:
      - proxy_net
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: embedding-service
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - proxy_net
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  embedding-consumer:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: embedding-consumer
    command: ["python", "consumer.py"]
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f consumer.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  database-service:
    build:
      context: .
      dockerfile: services/database-service/Dockerfile
    container_name: database-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    networks:
      - proxy_net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-consumer:
    build:
      context: .
      dockerfile: services/database-service/Dockerfile
    container_name: db-consumer
    command: ["python", "consumer.py"]
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    networks:
      - proxy_net
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f consumer.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  modular-api:
    build:
      context: .
      dockerfile: services/modular-api/Dockerfile
    container_name: modular-api
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - proxy_net
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # --- Energy Domain Service ---
  energy-service:
    build:
      context: .
      dockerfile: services/energy-service/Dockerfile
    container_name: energy-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENERGY_LOAD_SEED: ${ENERGY_LOAD_SEED:-0}
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --- ML Platform Service ---
  ml-platform:
    build:
      context: .
      dockerfile: services/ml-platform/Dockerfile
    container_name: ml-platform
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENERGY_SERVICE_URL: http://energy-service:8000
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-file:./mlruns}
      DVC_REMOTE: ${DVC_REMOTE:-./data/dvc-store}
      SERVICE_VERSION: ${SERVICE_VERSION}
      GIT_COMMIT: ${GIT_COMMIT}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
      energy-service:
        condition: service_healthy
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ml-platform's Kafka consumer — replaces the old ml-service/ml-consumer
  # pair (services/ml-service/, retired). Same image as ml-platform, just
  # runs consumer/article_enrichment.py instead of the FastAPI app.
  ml-platform-consumer:
    build:
      context: .
      dockerfile: services/ml-platform/Dockerfile
    container_name: ml-platform-consumer
    command: ["python", "consumer/article_enrichment.py"]
    restart: always
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_PLATFORM_URL: http://ml-platform:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - proxy_net
    depends_on:
      kafka:
        condition: service_healthy
      ml-platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f article_enrichment.py || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Frontend Application ---
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: proxydefence-frontend
    ports:
      - "3000:80"
    depends_on:
      modular-api:
        condition: service_healthy
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  elasticsearch_data:
